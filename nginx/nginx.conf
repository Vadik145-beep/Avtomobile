upstream backend {
    server backend:8000;
}

upstream admin {
    server admin:80;
}

upstream miniapp {
    server miniapp:80;
}

# ── Редирект www → без www ──────────────────────────────────────────────────
server {
    listen 80;
    server_name www.zayavki-auto.ru;
    return 301 http://zayavki-auto.ru$request_uri;
}

# ── Админ-панель: zayavki-auto.ru ──────────────────────────────────────────
server {
    listen 80;
    server_name zayavki-auto.ru 217.26.26.237;

    client_max_body_size 10m;

    # API и вебхуки — FastAPI backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /webhook/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /docs {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend;
        proxy_set_header Host $host;
    }

    # React SPA — admin panel
    location / {
        proxy_pass http://admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @spa_fallback;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location @spa_fallback {
        rewrite ^ /index.html break;
        proxy_pass http://admin;
        proxy_set_header Host $host;
    }
}

# ── MiniApp HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    server_name mini-app.zayavki-auto.ru;
    return 301 https://$host$request_uri;
}

# ── MiniApp: mini-app.zayavki-auto.ru (HTTPS) ──────────────────────────────
server {
    listen 443 ssl;
    server_name mini-app.zayavki-auto.ru;

    ssl_certificate     /etc/nginx/certs/mini-app-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/mini-app-privkey.pem;

    client_max_body_size 10m;

    # API запросы от MiniApp → backend
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React SPA — MiniApp
    location / {
        proxy_pass http://miniapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @miniapp_spa_fallback;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location @miniapp_spa_fallback {
        rewrite ^ /index.html break;
        proxy_pass http://miniapp;
        proxy_set_header Host $host;
    }
}
